name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (the tag is in the comment).
# actions/checkout v4.2.2, actions/setup-python v5.6.0, actions/setup-node v4.4.0.
jobs:
  tests:
    name: Tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        # 3.9 is the oldest Python the project is tested with (and the minimum it supports); 3.13 is current.
        python: ["3.9", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # No pip install: these tests use only the standard library (fastapi/numpy are replaced by small stand-in
      # modules where needed). The full-stack smoke job below installs the real dependencies.
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check client/app.js
          python -m py_compile $(git ls-files '*.py')
          for f in tests/*.js; do node --check "$f"; done
          git diff --check

      - name: Python tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/test_*.py; do
            echo "=== $t"
            python "$t"
          done

      - name: Node tests
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/test_*.js; do
            echo "=== $t"
            node "$t"
          done

  smoke:
    name: Full-stack smoke (real fastapi and numpy)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The smoke scripts run player code through the validators on the CI machine itself (no Docker image is
      # built in CI), so they need the explicit, unsafe opt-in. This is a disposable runner, not a player's computer.
      - name: Full-stack smoke
        env:
          ULT_ALLOW_HOST_EXEC: "1"
        run: python scripts/full_stack_smoke.py

      - name: First portal smoke
        env:
          ULT_ALLOW_HOST_EXEC: "1"
        run: python scripts/first_portal_smoke.py
